name: Monthly KZ-MCI PCA

on:
  schedule:
    - cron: '0 2 1 * *'   # 1st of each month at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn requests

      - name: Run full PCA reestimation
        run: python scripts/update_index.py
        env:
          FORCE_MONTH_START: "true"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Monthly PCA reestimation $(date +'%Y-%m')"
          git push

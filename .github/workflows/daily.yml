name: Daily KZ-MCI Update

on:
  schedule:
    - cron: '0 13 * * 1-5'   # weekdays at 13:00 UTC = 19:00 Almaty
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn requests

      - name: Run unified update
        run: python scripts/update_index.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "KZ-MCI update $(date +'%Y-%m-%d')"
          git push
